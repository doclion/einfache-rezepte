<!DOCTYPE html>
<html lang="de">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip-link" href="#inhalt">Zum Inhalt springen</a>

<header class="kopf">
  <div class="wrap kopf-inner">
    <a class="marke" href="{{ "" | relURL }}">
      Einfache Rezepte
      <span class="marke-nr">{{ len (where site.RegularPages "Section" "posts") }} Rezepte</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="hauptnav" aria-label="Menü öffnen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <nav class="nav" id="hauptnav" aria-label="Hauptnavigation">
      {{ $aktuell := . }}
      {{ range site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if $aktuell.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>

<main id="inhalt">
  {{ block "main" . }}{{ end }}
</main>

{{ partial "fuss.html" . }}

<script src="{{ "js/app.js" | relURL }}" defer></script>
{{ block "skripte" . }}{{ end }}
</body>
</html>
