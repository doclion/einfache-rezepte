baseURL: "https://doclion.github.io/einfache-rezepte/"
languageCode: "de-de"
defaultContentLanguage: "de"
title: "Einfache Rezepte"
theme: "einfache-rezepte"
timeZone: "Europe/Berlin"
enableRobotsTXT: true
enableEmoji: true

# canonifyURLs war hier drin und ist der Grund fuer kaputte Links beim
# Domainwechsel. Absichtlich entfernt: alle Links laufen ueber relURL.

pagination:
  pagerSize: 12

permalinks:
  posts: "/:slug/"

taxonomies:
  tags: "tags"
  categories: "categories"

sitemap:
  changefreq: "weekly"
  filename: "sitemap.xml"
  priority: 0.6

outputs:
  home: ["HTML", "RSS"]
  page: ["HTML"]
  section: ["HTML", "RSS"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

imaging:
  quality: 78
  resampleFilter: "Lanczos"

menus:
  main:
    - name: "Rezepte"
      url: "/posts/"
      weight: 10
    - name: "Kategorien"
      url: "/categories/"
      weight: 20
    - name: "Über uns"
      url: "/ueber-uns/"
      weight: 30

params:
  description: "Alltagstaugliche Rezepte mit klaren Mengenangaben, ehrlichen Zeitangaben und Schritt-für-Schritt-Kochmodus."
  author: "Max Mustermann"          # TODO: echten Namen eintragen
  siteAltName: "Einfache Rezepte — Kochen für jeden Tag"
  footerText: "Alltagstaugliche Rezepte mit klaren Mengenangaben und Schritten, die auch beim ersten Versuch funktionieren."
  # defaultImage: "bilder/social-fallback.jpg"   # in assets/ ablegen, optional
  # logo: "bilder/logo.png"                      # optional, fuer Schema.org publisher

  affiliateText: "Einige Links auf dieser Seite sind Provisions-Links. Als Amazon-Partner verdienen wir an qualifizierten Verkäufen. Für dich ändert sich der Preis dadurch nicht."
  affiliateHinweisOben: true        # Kennzeichnung vor dem ersten Link, nicht erst im Footer
  amazonTag: "einfachrezepte21"

  seo:
    googleVerification: ""
    bingVerification: ""
    pinterestVerification: ""

  # Pflichtangaben nach § 5 DDG. Diese Werte landen im Impressum.
  # TODO: vollstaendig und wahrheitsgemaess ausfuellen, sonst abmahnfaehig.
  kontakt:
    name: "Max Mustermann"
    strasse: "Musterstraße 1"
    ort: "90762 Fürth"
    land: "Deutschland"
    email: "kontakt@example.de"
    telefon: ""
    ustid: ""
